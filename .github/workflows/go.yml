name: Go

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.go', 'go.mod', 'go.sum', '**/testdata/**', 'crates/docpath/**', 'crates/atomic/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['**.go', 'go.mod', 'go.sum', '**/testdata/**', 'crates/docpath/**', 'crates/atomic/**', '.github/workflows/go.yml']

permissions:
  contents: read

jobs:
  gates:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # fmt, vet, nopanic, staticcheck, test, wasm, licences, vuln (GOFLAGS=-mod=mod is set by the tool).
      - run: go run -mod=mod ./tools/ci
      - name: Inherited ACLs (atomic)
        run: |
          sudo apt-get update && sudo apt-get install -y acl
          CRAFT_ATOMIC_ACL=1 go test -mod=mod -count=1 -run ACL -v ./atomic
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run -mod=mod ./tools/ci test

  # Ports compared with the Rust crates they replace, on every OS (platform rules differ).
  rust-diff:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the docpath reference
        run: cargo build --release --manifest-path docpath/testdata/rust-oracle/Cargo.toml
      - name: Compare docpath with Rust
        env:
          CRAFT_DOCPATH_RUST: ${{ github.workspace }}/docpath/testdata/rust-oracle/target/release/docpath-diff${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go test -mod=mod -count=1 -run TestMatchesRust -v ./docpath
      - name: Build the serdejson reference
        run: cargo build --release --manifest-path serdejson/testdata/rust-oracle/Cargo.toml
      - name: Compare serdejson with serde_json
        env:
          CRAFT_SERDEJSON_RUST: ${{ github.workspace }}/serdejson/testdata/rust-oracle/target/release/serdejson-oracle${{ runner.os == 'Windows' && '.exe' || '' }}
          CRAFT_SERDEJSON_CASES: "100000"
        run: go test -mod=mod -count=1 -run TestMatchesRust -v ./serdejson
