[package]
name = "serdejson-oracle"
version = "0.0.0"
edition = "2024"
publish = false

# serde and serde_json as the Rust Craft apps build them (WordCraft's baseline locks serde_json
# 1.0.151 with float_roundtrip).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

